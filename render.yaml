# Render Blueprint — vedi README.md "Deploy su Render" per i passi completi.
# Free web service: nessuna carta di credito richiesta, HTTPS automatico,
# va in sleep dopo ~15 min di inattività (cold start ~30-60s alla riattivazione).
services:
  - type: web
    name: painpoint-researcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Ollama non è utilizzabile su questo piano (nessuna GPU/modello
      # locale). Il provider mistral divide il lavoro in due fasi/due
      # modelli per via dei rate limit per-modello di La Plateforme (vedi
      # providers/mistral_provider.py): ministral-8b-2512 (alto throughput)
      # per il loop di ricerca con i tool, mistral-large-2512 (throughput
      # molto basso ma qualità migliore) per l'unica chiamata finale di
      # finalizzazione. anthropic/azure/gemini/groq restano nel codice come
      # alternative a provider mistral nel suo complesso.
      - key: PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_RESEARCH_MODEL
        value: ministral-8b-2512
      - key: MISTRAL_SYNTHESIS_MODEL
        value: mistral-large-2512
      # Storage persistente per i report generati (Postgres + Storage bucket).
      # Vedi supabase/schema.sql per la tabella e il README per il bucket.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: reports
      # Protezione della UI/API: senza queste due, l'app resta aperta a
      # chiunque abbia l'URL.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      # Opzionale ma raccomandata: scoperta fonti via Tavily invece dello
      # scraping di backend di metasearch generici (ddgs) — vedi .env.example.
      - key: TAVILY_API_KEY
        sync: false
