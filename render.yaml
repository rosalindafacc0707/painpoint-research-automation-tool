# Render Blueprint — vedi README.md "Deploy su Render" per i passi completi.
# Free web service: nessuna carta di credito richiesta, HTTPS automatico,
# va in sleep dopo ~15 min di inattività (cold start ~30-60s alla riattivazione).
services:
  - type: web
    name: painpoint-researcher
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Ollama non è utilizzabile su questo piano (nessuna GPU/modello
      # locale). Provider hosted provati in ordine, tutti a costo zero:
      # Groq (gpt-oss-120b) fu il primo, ma in uso reale ha colpito il suo
      # tetto di 200.000 TOKEN AL GIORNO — un limite duro. Gemini
      # (gemini-3.5-flash) non ha quel tetto ma solo 15 richieste/minuto.
      # Mistral (mistral-small-latest) è risultato il migliore nei test dal
      # vivo: rispetta la disciplina di lettura fonti del prompt (a
      # differenza delle varianti "lite" di Gemini, che citano dagli
      # snippet senza leggere le pagine), fa poche chiamate per topic
      # (batch efficiente di ricerche/letture), e ha retto 30 chiamate
      # concorrenti senza un solo 429 in un test di carico — nessun tetto
      # giornaliero sui token riscontrato. providers/gemini_provider.py e
      # providers/groq_provider.py restano nel codice come alternative.
      - key: RESEARCH_AGENT_PROVIDER
        value: mistral
      - key: SYNTHESIS_AGENT_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      # 512MB RAM on this plan: 8 concurrent MCP subprocesses can get
      # SIGKILL'd (exit 137). 3 keeps peak memory well under the limit at
      # the cost of the research phase taking longer (topics run in waves
      # of 3 instead of all 8 at once). Raise only if you upgrade the plan.
      - key: RESEARCH_AGENT_CONCURRENCY
        value: "3"
      # Storage persistente per i report generati (Postgres + Storage bucket).
      # Vedi supabase/schema.sql per la tabella e il README per il bucket.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: reports
      # Protezione della UI/API: senza queste due, l'app resta aperta a
      # chiunque abbia l'URL.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      # Opzionale ma raccomandata: scoperta fonti via Tavily invece del
      # fallback ddgs generico.
      - key: TAVILY_API_KEY
        sync: false
