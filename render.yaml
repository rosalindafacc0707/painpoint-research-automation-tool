# Render Blueprint — vedi README.md "Deploy su Render" per i passi completi.
# Free web service: nessuna carta di credito richiesta, HTTPS automatico,
# va in sleep dopo ~15 min di inattività (cold start ~30-60s alla riattivazione).
services:
  - type: web
    name: painpoint-researcher
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Ollama non è utilizzabile su questo piano (nessuna GPU/modello
      # locale) — Groq è il provider hosted gratuito consigliato, già
      # dotato di rate limiting per 8 agenti paralleli (providers/groq_provider.py).
      - key: RESEARCH_AGENT_PROVIDER
        value: groq
      - key: SYNTHESIS_AGENT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # 512MB RAM on this plan: 8 concurrent MCP subprocesses can get
      # SIGKILL'd (exit 137). 3 keeps peak memory well under the limit at
      # the cost of the research phase taking longer (topics run in waves
      # of 3 instead of all 8 at once). Raise only if you upgrade the plan.
      - key: RESEARCH_AGENT_CONCURRENCY
        value: "3"
      # Storage persistente per i report generati (Postgres + Storage bucket).
      # Vedi supabase/schema.sql per la tabella e il README per il bucket.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: reports
      # Protezione della UI/API: senza queste due, l'app resta aperta a
      # chiunque abbia l'URL.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      # Opzionale ma raccomandata: scoperta fonti via Tavily invece del
      # fallback ddgs generico.
      - key: TAVILY_API_KEY
        sync: false
